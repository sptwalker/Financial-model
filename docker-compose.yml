# 生产部署 — postgres + api + nginx
# 仓库根 .env 提供：POSTGRES_PASSWORD / SECRET_KEY / FEISHU_APP_ID / FEISHU_APP_SECRET
#                    以及可选的 WEB_PORT / FRONTEND_URL / FEISHU_REDIRECT_URI
# 用法：docker compose up -d --build；停止：docker compose down（数据保留在 pgdata 卷）
# 一键发布：./restart.sh
name: fm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fmuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在仓库根 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: financial_model
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmuser -d financial_model"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      target: api
      args:
        # 国内构建走华为云 pypi 镜像；改官方源见 Dockerfile 顶部说明
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://repo.huaweicloud.com/repository/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-repo.huaweicloud.com}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEBUG: "false"
      ENABLE_DEV_LOGIN: "false"
      DATABASE_URL: postgresql+psycopg2://fmuser:${POSTGRES_PASSWORD}@postgres:5432/financial_model
      SECRET_KEY: ${SECRET_KEY:?请在仓库根 .env 设置 SECRET_KEY}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      # 默认值仅作占位：生产务必在根 .env 显式设置真正的对外域名
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://localhost:8021/api/v1/auth/feishu/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8021}
      # 初始角色名单（JSON 数组，飞书 open_id）；刘丹默认管理员填入 INITIAL_ADMIN_FEISHU_IDS
      INITIAL_ADMIN_FEISHU_IDS: ${INITIAL_ADMIN_FEISHU_IDS:-[]}
      INITIAL_EDITOR_FEISHU_IDS: ${INITIAL_EDITOR_FEISHU_IDS:-[]}
    volumes:
      # 只读挂载本机 SQLite 数据（一次迁移种子源；迁移幂等，可安全重启）
      - ./backend/data:/mnt/sqlite-data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 宿主机端口可配（默认 8021，见根 .env 的 WEB_PORT）
      - "${WEB_PORT:-8021}:80"

volumes:
  pgdata:
